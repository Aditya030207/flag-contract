name: Flag Contract
description: Check audience-level feature flag behavior against a Flagsmith environment
inputs:
  contract:
    description: Path to the JSON contract relative to the checked-out repository
    required: true
  matrix:
    description: Treat contract as an environment manifest and read named SDK keys from the job environment
    default: 'false'
  api-url:
    description: Flagsmith SDK API base URL for live checks, ending in /api/v1/
    required: false
  environment-key:
    description: Client-side SDK environment key for live checks
    required: false
  check-only:
    description: Set to true to validate the JSON contract offline
    default: 'false'
  redact-values:
    description: Set to true to omit expected and actual configuration values from reports
    default: 'false'
outputs:
  report-path:
    description: Absolute path to the JSON report on the runner
    value: ${{ steps.verify.outputs.report-path }}
  status:
    description: Contract result (pass, fail, valid, or error)
    value: ${{ steps.verify.outputs.status }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
        package-manager-cache: false
    - id: verify
      name: Run rollout contract
      shell: bash
      env:
        FLAG_CONTRACT_MATRIX: ${{ inputs.matrix }}
        FLAG_CONTRACT_FILE: ${{ inputs.contract }}
        FLAG_CONTRACT_CHECK_ONLY: ${{ inputs.check-only }}
        FLAG_CONTRACT_REDACT_VALUES: ${{ inputs.redact-values }}
        FLAGSMITH_API_URL: ${{ inputs.api-url }}
        FLAGSMITH_ENVIRONMENT_KEY: ${{ inputs.environment-key }}
      run: node "$GITHUB_ACTION_PATH/github-action.mjs"
